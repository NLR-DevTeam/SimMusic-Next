<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>播放页</title>
    <!-- /.sim/ 是宿主提供给扩展页面的 SimUI、字体与播放控制，页面其余文件来自扩展目录 -->
    <link rel="stylesheet" href="/.sim/fonts.css">
    <link rel="stylesheet" href="/.sim/simui.css">
    <link rel="stylesheet" href="player.css">
    <link rel="stylesheet" href="/.sim/runtime.css" id="runtimeCss">
    <script src="/.sim/cssRules.js" defer></script>
    <script src="/.sim/simui.js" defer></script>
    <script src="/.sim/player.js" defer></script>
    <script src="player.js" defer></script>
</head>
<body class="hideList">
    <header id="titleBar">
        <div class="titleActions">
            <button id="collapseButton" class="titleButton windowsIcon" title="收起播放器">&#xEAB4;</button>
            <button id="minimizeButton" class="titleButton windowsIcon" title="最小化">&#xEABA;</button>
            <button id="maximizeButton" class="titleButton windowsIcon" title="最大化 / 还原">&#xEAB9;</button>
            <button id="closeButton" class="titleButton windowsIcon closeButton" title="关闭">&#xEAB8;</button>
        </div>
    </header>
    <section id="playPage">
        <div id="coverAtmosphere" class="coverAtmosphere"><div></div><div></div><div></div></div>
        <div class="playerContainer">
            <div class="controls">
                <img id="largeCover" src="/.sim/assets/placeholder.png">
                <div class="infoBar"><div class="musicInfo"><b id="largeTitle">未在播放</b><div id="largeArtist">未知艺术家</div></div><button id="trackMoreButton" class="iconButton" title="更多操作"><i>&#xEF77;</i></button></div>
                <div class="progressControl"><span id="positionLabel">0:00</span><div id="largeSeekBar" class="progress" min="0" max="1" value="0"></div><span id="durationLabel">0:00</span></div>
                <div class="buttons">
                    <button id="largeQueueButton" class="iconButton listBtn" title="播放队列"><i>&#xF011;</i></button>
                    <button id="largeModeButton" class="iconButton" title="播放模式"><i>&#xF072;</i></button>
                    <button id="largePreviousButton" class="iconButton larger" title="上一首"><i>&#xF140;</i></button>
                    <button id="largeToggleButton" class="iconButton play" title="播放 / 暂停"><svg class="playGlyph" viewBox="0 0 24 24"><path/><path/></svg></button>
                    <button id="largeNextButton" class="iconButton larger" title="下一首"><i>&#xF144;</i></button>
                    <div class="largeVolumeControl"><button id="largeVolumeButton" class="iconButton" title="音量"><i>&#xF2A2;</i></button><div id="largeVolumeBar" class="progress" min="0" max="1" value="0.8" hidden></div></div>
                    <button id="lyricsButton" class="iconButton lyricsBtn" title="歌词"><i>&#xF201;</i></button>
                </div>
            </div>
            <div id="lyricsPanel" class="lyrics"><div id="lyricsView" class="lyricsScroll"><div class="emptyLyrics">暂无歌词</div></div></div>
            <aside id="queuePanel" class="list" hidden><div id="queueTracks"></div></aside>
        </div>
    </section>
</body>
</html>
